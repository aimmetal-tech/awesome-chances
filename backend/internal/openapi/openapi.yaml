  "/api/v1/competitions":
    get:
      tags: ["1 竞赛规划"]
      summary: "[1.1.1] 查询竞赛列表"
      description: "分页查询后端示例任务。类型固定为 competition；尚未连接真实外部数据源。"
      operationId: "competitions"
      x-route-number: "1.1.1"
      x-router-group: 1
      x-handler: "Competitions"
      x-implementation-status: "demo"
      parameters:
        - name: "type"
          in: "query"
          required: false
          description: "本栏目固定返回 competition；传入 type 时必须为该值，否则返回 400。"
          schema:
            type: "string"
            enum: ["competition"]
        - $ref: "#/components/parameters/Category"

        - $ref: "#/components/parameters/Query"

        - $ref: "#/components/parameters/Page"

        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: "查询成功。"
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TaskPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    head:
      tags: ["1 竞赛规划"]
      summary: "[1.1.1] 查询竞赛列表（仅响应头）"
      description: "与同路径 GET 执行相同校验和分组中间件；HTTP HEAD 不返回响应体。"
      operationId: "headCompetitions"
      x-route-number: "1.1.1"
      x-router-group: 1
      x-handler: "Competitions"
      x-implementation-status: "demo"
      x-get-operation-id: "competitions"
      parameters:
