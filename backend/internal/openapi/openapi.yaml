# 当前 Go 后端接口契约；描述与路由/Handler/model 保持同步。
# 本文件只提供规范描述，不注册新路由，也不包含数据库凭据。
# GET 与 HEAD 分别描述；路径参数使用 OpenAPI 的 {id}。
# 两个未接入接口只声明实际错误响应；工具的 operation-2xx-response 提示属于风格警告。
openapi: "3.1.0"
jsonSchemaDialect: "https://spec.openapis.org/oas/3.1/dialect/base"
info:
  title: "启航 · 校园 AI 导学平台后端接口"
  version: "0.1.0"
  description: >-
    描述当前 Go + Gin 后端的实际接口，不包含 Next.js /api/* BFF。路径包含完整 /api/v1 前缀，健康检查例外。服务器地址与端口由后端 .env 配置（兼容上层 .env）；
    相对服务器 URL 不绑定端口，离线导入工具时请选择实际后端地址。当前画像/任务/反馈为演示，认证代码使用 PostgreSQL，AI 和实时 GitHub 尚未接入。
    读取接口显式支持 GET/HEAD，HEAD 不返回响应体。业务和错误响应为 JSON，均禁止缓存并携带 X-Request-ID。未知路径返回 JSON 404；
    已注册路径的不支持方法返回 JSON 405 并携带 Allow。请求 JSON 限制为 64 KiB。
    此文档以 .env.example 默认密码长度和 Cookie 名称为准，修改这两项后需同步对应 Schema/securityScheme；文档不读取 .env，不包含真实密钥。
servers:
  - url: "/"
    description: "当前 Go 服务的根地址；端口取自 .env。离线查看或导入时替换为实际后端地址，不使用 Next.js Web 地址。"
security: []
tags:
  - name: "1 竞赛规划"
    description: "查询示例竞赛并预览备赛步骤；没有实时赛事信息。"
  - name: "2 项目导学"
    description: "查询示例项目并预览实践步骤；没有真实源码分析。"
  - name: "3 方向导学"
    description: "预置方向介绍与尚未接入的 AI 对话入口。"
  - name: "4 开源贡献"
    description: "示例 Issue 与尚未接入的实时 GitHub 搜索入口。"
  - name: "5 画像与成长"
    description: "默认画像、画像校验、规则推荐与内存反馈。"
  - name: "6 统一学习任务"
    description: "统一任务列表、详情与计划预览。"
  - name: "7 系统与初始化"
    description: "进程存活及 Web 初始化。"
  - name: "8 用户认证"
    description: "PostgreSQL 注册登录、身份查询及会话撤销。"
